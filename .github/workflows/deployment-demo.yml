name: Kubernetes and monitoring demonstration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demonstrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and browser
        run: |
          pip install -r requirements.txt
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build the submitted model image
        run: docker build -t heartcare:1.0 .
      - name: Start monitoring and generate measured traffic
        run: |
          mkdir -p evidence screenshots
          export GRAFANA_PASSWORD="$(openssl rand -hex 20)"
          echo "::add-mask::$GRAFANA_PASSWORD"
          echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$GITHUB_ENV"
          docker compose -f monitoring/compose.yaml -f monitoring/compose.ci.yaml up --build -d
          python -m scripts.monitoring_demo
      - name: Capture monitoring browser evidence
        run: node scripts/capture_evidence.mjs monitoring
      - name: Install and start Minikube
        run: |
          curl -fsSLo minikube-linux-amd64 https://storage.googleapis.com/minikube/releases/v1.37.0/minikube-linux-amd64
          curl -fsSLo minikube.sha256 https://storage.googleapis.com/minikube/releases/v1.37.0/minikube-linux-amd64.sha256
          echo "$(cat minikube.sha256)  minikube-linux-amd64" | sha256sum --check
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube start --driver=docker --kubernetes-version=v1.33.1 --cpus=2 --memory=3072
          minikube addons enable ingress
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=240s
      - name: Deploy two replicas and exercise the ingress endpoint
        run: |
          mkdir -p evidence screenshots
          minikube image load heartcare:1.0
          kubectl apply -f k8s/api.yaml
          kubectl rollout status deployment/heartcare --timeout=240s | tee evidence/kubernetes-rollout.txt
          kubectl get pods,svc,ingress -o wide | tee evidence/kubernetes-resources.txt
          kubectl get deployment heartcare -o json > evidence/kubernetes-deployment.json
          echo "API_URL=http://$(minikube ip)" >> "$GITHUB_ENV"
          export API_URL="http://$(minikube ip)"
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then break; fi
            sleep 2
          done
          python -m scripts.smoke | tee evidence/ingress-smoke.txt
      - name: Capture ingress and CI browser evidence
        run: node scripts/capture_evidence.mjs ingress
      - name: Collect diagnostic logs
        if: always()
        run: |
          mkdir -p evidence
          kubectl get pods,svc,ingress -o wide > evidence/kubernetes-final.txt 2>&1 || true
          kubectl logs -l app=heartcare --all-containers --prefix > evidence/kubernetes-requests.log 2>&1 || true
          docker compose -f monitoring/compose.yaml -f monitoring/compose.ci.yaml logs --no-color > evidence/monitoring.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-and-monitoring-evidence
          path: |
            evidence/
            screenshots/
          retention-days: 7
      - name: Remove the disposable demo
        if: always()
        run: |
          docker compose -f monitoring/compose.yaml -f monitoring/compose.ci.yaml down || true
          minikube delete || true
