apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartcare
spec:
  replicas: 2
  selector:
    matchLabels: {app: heartcare}
  template:
    metadata:
      labels: {app: heartcare}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: heartcare:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: heartcare
spec:
  type: ClusterIP
  selector: {app: heartcare}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartcare
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartcare
                port: {number: 8000}
