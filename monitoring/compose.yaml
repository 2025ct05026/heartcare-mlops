services:
  api:
    build: ..
    ports: ['8000:8000']
  prometheus:
    image: prom/prometheus:v3.7.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['127.0.0.1:9090:9090']
    depends_on: [api]
  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD before starting}
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/heartcare.json:ro
    ports: ['127.0.0.1:3000:3000']
    depends_on: [prometheus]
